name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install
        run: pip install -e '.[dev]'
      # Root so the sandbox can switch uids and unshare the network namespace,
      # which the security tests check.
      - name: Test
        run: sudo -E env "PATH=$PATH" python -m pytest -q

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t outpost-ejudge .
      - name: Smoke test
        run: |
          docker run --rm outpost-ejudge sh -c 'g++ --version && javac -version && outpost --version'
