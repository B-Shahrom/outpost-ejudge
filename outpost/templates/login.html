{% extends "base.html" %}
{% block title %}Sign in · Outpost{% endblock %}
{% block content %}
<div class="panel" style="max-width:380px;margin:40px auto">
  <h1>Sign in</h1>
  <p class="muted small">Use the login from your slip.</p>
  <form method="post" action="/login" class="stack">
    <label for="u">Username</label>
    <input id="u" type="text" name="username" autocomplete="username" autocapitalize="none" autofocus required>
    <label for="p">Password</label>
    <input id="p" type="password" name="password" autocomplete="current-password" required>
    <p><button class="primary" type="submit">Sign in</button></p>
  </form>
</div>
{% endblock %}
