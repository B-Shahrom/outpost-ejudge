# Start with ./start.sh (Linux, macOS) or start-windows.bat (Windows): they find
# this laptop's address for the login slips and create the first admin.
#
# By hand:  OUTPOST_PUBLIC_URL=http://<this laptop's IP>:8000/ docker compose up -d --build
#           docker compose exec outpost outpost admin jury
services:
  outpost:
    build: .
    ports:
      - "8000:8000"
    # Each run gets its own empty network namespace (no network at all for
    # submissions); creating one needs SYS_ADMIN inside the container.
    cap_add: [SYS_ADMIN]
    security_opt: ["seccomp=unconfined", "apparmor=unconfined"]
    volumes:
      # A named volume, not ./outpost-data: on Windows and macOS a folder
      # shared from the host has unreliable file locking for SQLite. Back up
      # with:  docker compose cp outpost:/data ./outpost-backup
      - outpost-data:/data
    environment:
      OUTPOST_PORT: "8000"
      OUTPOST_PUBLIC_URL: ${OUTPOST_PUBLIC_URL:-}
      # OUTPOST_WORKERS: "3"   # default: CPU cores - 1
    restart: unless-stopped

volumes:
  outpost-data:
